# ============================================================================
# Сборка базовых образов ROS2 Humble + CUDA
# ============================================================================
name: Build Base Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/base/**'
      - '.github/workflows/build-base.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        default: 'cross'
        options:
          - cross
          - native
          - both

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate build matrix
        id: gen
        uses: ./.github/actions/generate-matrix
        with:
          build_type: ${{ github.event.inputs.build_type || 'cross' }}
          spec: |
            [
              {"platform":"amd64","docker_platform":"linux/amd64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.9.0-devel-ubuntu22.04","with_slam":"false","tag_suffix":"amd64-minimal"},
              {"platform":"amd64","docker_platform":"linux/amd64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.9.0-devel-ubuntu22.04","with_slam":"true","tag_suffix":"amd64-slam"},
              {"platform":"arm64-agx","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04","with_slam":"false","tag_suffix":"arm64-agx-cross-minimal"},
              {"platform":"arm64-agx","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04","with_slam":"true","tag_suffix":"arm64-agx-cross-slam"},
              {"platform":"arm64-agx","docker_platform":"linux/arm64","build_type":"native","runner":"[self-hosted, linux, arm64, jetson-agx]","base_image":"nvcr.io/nvidia/l4t-jetpack:r36.4.0","with_slam":"true","tag_suffix":"arm64-agx-native"},
              {"platform":"arm64-nano","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04","with_slam":"false","tag_suffix":"arm64-nano-cross-minimal"},
              {"platform":"arm64-nano","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04","base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04","with_slam":"true","tag_suffix":"arm64-nano-cross-slam"},
              {"platform":"arm64-nano","docker_platform":"linux/arm64","build_type":"native","runner":"[self-hosted, linux, arm64, jetson-nano]","base_image":"nvcr.io/nvidia/l4t-jetpack:r36.4.0","with_slam":"true","tag_suffix":"arm64-nano-native"}
            ]

  build-base:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          setup_qemu: ${{ matrix.build_type == 'cross' && 'true' || 'false' }}
          ngc_login: ${{ matrix.build_type == 'native' && 'true' || 'false' }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
          ngc_api_key: ${{ secrets.NGC_API_KEY }}

      - name: Build and push minimal base image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-minimal
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-minimal-latest
          cache-from: type=gha,scope=base-${{ matrix.tag_suffix }}-minimal
          cache-to: type=gha,mode=max,scope=base-${{ matrix.tag_suffix }}-minimal

      - name: Build and push SLAM extension
        if: matrix.with_slam == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          file: ./docker/base/slam.Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-minimal
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-slam
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-slam-latest
          cache-from: type=gha,scope=base-${{ matrix.tag_suffix }}-slam
          cache-to: type=gha,mode=max,scope=base-${{ matrix.tag_suffix }}-slam

      - name: Publish convenience tag
        if: matrix.with_slam == 'true'
        run: |
          SRC=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-slam
          TARGET=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}
          docker buildx imagetools create --tag "${TARGET}" "${SRC}"

      - name: Verify image (ROS2 + CUDA per TZ)
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}${{ matrix.with_slam == 'true' && '-slam' || '-minimal' }}
          docker run --rm \
            --platform ${{ matrix.docker_platform }} \
            "${IMAGE}" \
            bash -c "
              set -e
              echo '=== 1. ROS2 check ==='
              ros2 --help > /dev/null 2>&1 && echo 'PASS: ros2 --help (exit 0)'
              echo '=== 2. CUDA nvcc check ==='
              nvcc --version && echo 'PASS: nvcc --version (exit 0)'
              echo '=== 3. CUDA runtime libs ==='
              ldconfig -p | grep libcudart && echo 'PASS: libcudart found'
              echo '=== 4. Non-root user ==='
              whoami | grep -q '^ros$' && echo 'PASS: non-root user ros'
              echo '=== 5. Contract ENV ==='
              env | grep -E '^ROS2_|^ROS_DISTRO'
              echo '=== ALL CHECKS PASSED ==='
            "