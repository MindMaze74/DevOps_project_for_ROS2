# ============================================================================
# Сборка базовых образов ROS2 Humble + CUDA
# ============================================================================
# Матрица: 3 платформы × 2 способа сборки
#
# Cross (QEMU на x86):
#   - amd64      : nvidia/cuda:12.9.0-devel-ubuntu22.04
#   - arm64-agx  : nvidia/cuda:12.8.2-devel-ubuntu22.04
#   - arm64-nano : nvidia/cuda:12.8.2-devel-ubuntu22.04
#
# Native (self-hosted Jetson):
#   - arm64-agx  : nvcr.io/nvidia/l4t-jetpack:r36.4.0
#   - arm64-nano : nvcr.io/nvidia/l4t-jetpack:r36.4.0
# ============================================================================
name: Build Base Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/base/**'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        default: 'cross'
        options:
          - cross
          - native
          - both

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: gen
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          else
            BUILD_TYPE="cross"
          fi

          ALL='[
            {"platform":"amd64","cuda_arch":"75","docker_platform":"linux/amd64",
             "build_type":"cross","runner":"ubuntu-22.04",
             "base_image":"nvidia/cuda:12.9.0-devel-ubuntu22.04",
             "tag_suffix":"amd64"},
            {"platform":"arm64-agx","cuda_arch":"87","docker_platform":"linux/arm64",
             "build_type":"cross","runner":"ubuntu-22.04",
             "base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04",
             "tag_suffix":"arm64-agx-cross"},
            {"platform":"arm64-agx","cuda_arch":"87","docker_platform":"linux/arm64",
             "build_type":"native","runner":"[self-hosted, linux, arm64, jetson-agx]",
             "base_image":"nvcr.io/nvidia/l4t-jetpack:r36.4.0",
             "tag_suffix":"arm64-agx-native"},
            {"platform":"arm64-nano","cuda_arch":"72","docker_platform":"linux/arm64",
             "build_type":"cross","runner":"ubuntu-22.04",
             "base_image":"nvidia/cuda:12.8.2-devel-ubuntu22.04",
             "tag_suffix":"arm64-nano-cross"},
            {"platform":"arm64-nano","cuda_arch":"72","docker_platform":"linux/arm64",
             "build_type":"native","runner":"[self-hosted, linux, arm64, jetson-nano]",
             "base_image":"nvcr.io/nvidia/l4t-jetpack:r36.4.0",
             "tag_suffix":"arm64-nano-native"}
          ]'

          if [ "$BUILD_TYPE" = "both" ]; then
            FILTERED="$ALL"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg bt "$BUILD_TYPE" \
              '[.[] | select(.build_type == $bt)]')
          fi

          MATRIX=$(jq -nc --argjson m "$FILTERED" '{include: $m}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix:"
          echo "$MATRIX" | jq .

  build-base:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repository slug
        run: |
          REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_SLUG=${REPO_SLUG}" >> $GITHUB_ENV

      - name: Set up QEMU (cross only)
        if: matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to NVIDIA NGC (native only)
        if: matrix.build_type == 'native'
        uses: docker/login-action@v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_API_KEY }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}-latest
          cache-from: type=gha,scope=base-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.tag_suffix }}

      - name: Verify image
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }} \
            bash -c "
              echo '=== CUDA ===' && ldconfig -p | grep libcudart
              echo '=== ROS2 ===' && source /opt/ros/humble/setup.bash && ros2 --version
              echo '=== Non-root ===' && whoami
            "