# ============================================================================
# Сборка базовых образов: ROS2 Humble + CUDA
# ============================================================================
# Платформы:
#   amd64      — x86_64 + NVIDIA GPU (CUDA 12.9)
#   arm64-agx  — Jetson AGX Orin (JetPack 6.2.2, L4T R36.5.0)
#   arm64-nano — Jetson Orin Nano (JetPack 7, L4T R38.x)
#
# Триггеры: push в main (при изменении docker/base/), тег, ручной запуск
# ============================================================================
name: Build Base Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/base/**'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ros2-humble-cuda-base

jobs:
  build-base:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x86_64: NVIDIA CUDA devel ---
          - platform: amd64
            base_image: 'nvidia/cuda:12.9.0-devel-ubuntu22.04'
            tags: 'amd64'
            docker_platform: 'linux/amd64'

          # --- ARM64: Jetson AGX Orin (JetPack 6.2.2 / L4T R36.5.0) ---
          # ВАЖНО: официального r36.5.0 на NGC нет, используем r36.4.0
          # (совместим с 36.4.x и 36.5.0 согласно форуму NVIDIA)
          - platform: arm64-agx
            base_image: 'nvcr.io/nvidia/l4t-jetpack:r36.4.0'
            tags: 'arm64-agx'
            docker_platform: 'linux/arm64'

          # --- ARM64: Jetson Orin Nano (JetPack 7 / L4T R38.x) ---
          # Для JetPack 7 официальный l4t-jetpack не выпущен,
          # используем CUDA 13.0 devel на Ubuntu 24.04 (рекомендация NVIDIA)
          - platform: arm64-nano
            base_image: 'nvcr.io/nvidia/cuda:13.0.0-devel-ubuntu24.04'
            tags: 'arm64-nano'
            docker_platform: 'linux/arm64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (${{ matrix.platform }})
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          platforms: ${{ matrix.docker_platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tags }}-latest
          cache-from: type=gha,scope=base-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.platform }}

      - name: Verify CUDA and L4T version
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tags }} \
            bash -c "
              echo '=== CUDA check ==='
              ldconfig -p | grep libcudart || exit 1
              echo '=== L4T version (ARM only) ==='
              [ -f /etc/nv_tegra_release ] && cat /etc/nv_tegra_release || true
              echo '=== Base image verification PASSED ==='
            "