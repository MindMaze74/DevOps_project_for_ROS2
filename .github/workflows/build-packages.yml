# ============================================================================
# Сборка ROS2-пакетов поверх базовых образов
# ============================================================================
# Для каждого пакета используется base_variant из config/packages.yaml:
#   minimal → ros2-humble-cuda-base:<tag_suffix>-minimal
#   slam    → ros2-humble-cuda-base:<tag_suffix>-slam
#
# Для amd64 тег base — <tag_suffix>-<variant> (без cross/native суффикса).
# Для ARM64 cross — <platform>-cross-<variant>.
# Для ARM64 native — <platform>-native (содержит SLAM из l4t-jetpack).
# ============================================================================
name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/package/**'
      - 'config/**'
      - '.github/workflows/build-packages.yml'
      - '.github/actions/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package (empty = all)'
        default: ''
      platform:
        description: 'Platform (empty = all)'
        default: ''
      build_type:
        description: 'Build type'
        type: choice
        default: 'cross'
        options: [ cross, native, both ]

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4

      - name: Read packages.yaml
        id: pkgs
        run: |
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)
          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" \
              '[.[] | select(.name == $p)]')
          fi
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

      - name: Generate matrix
        id: gen
        uses: ./.github/actions/generate-matrix
        with:
          build_type: ${{ github.event.inputs.build_type || 'cross' }}
          packages: ${{ steps.pkgs.outputs.packages }}
          spec: |
            [
              {"platform":"amd64","tag_suffix":"amd64","cuda_arch":"75","docker_platform":"linux/amd64","build_type":"cross","runner":"ubuntu-22.04"},
              {"platform":"arm64-agx","tag_suffix":"arm64-agx-cross","cuda_arch":"87","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04"},
              {"platform":"arm64-agx","tag_suffix":"arm64-agx-native","cuda_arch":"87","docker_platform":"linux/arm64","build_type":"native","runner":"[self-hosted, linux, arm64, jetson-agx]"},
              {"platform":"arm64-nano","tag_suffix":"arm64-nano-cross","cuda_arch":"72","docker_platform":"linux/arm64","build_type":"cross","runner":"ubuntu-22.04"},
              {"platform":"arm64-nano","tag_suffix":"arm64-nano-native","cuda_arch":"72","docker_platform":"linux/arm64","build_type":"native","runner":"[self-hosted, linux, arm64, jetson-nano]"}
            ]

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          setup_qemu: ${{ matrix.build_type == 'cross' && 'true' || 'false' }}

      # --- Определение base-тега ---
      # amd64/cross:     <tag_suffix>-<variant>              (напр. amd64-slam)
      # arm64/cross:     <tag_suffix>-<variant>              (напр. arm64-agx-cross-slam)
      # arm64/native:    <platform>-native                    (SLAM из l4t-jetpack)
      - name: Resolve base tag
        id: base
        run: |
          if [ "${{ matrix.build_type }}" = "native" ]; then
            BASE_TAG="${{ matrix.platform }}-native"
          else
            BASE_TAG="${{ matrix.tag_suffix }}-${{ matrix.base_variant }}"
          fi
          echo "base_tag=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "Base tag: ${BASE_TAG}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/package/Dockerfile.template
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ steps.base.outputs.base_tag }}
            PACKAGE_GIT=${{ matrix.git }}
            PACKAGE_BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
            PACKAGE_DEPS_SCRIPT=${{ matrix.deps_script }}
          platforms: ${{ matrix.docker_platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }}-latest
          cache-from: type=gha,scope=pkg-${{ matrix.package }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=pkg-${{ matrix.package }}-${{ matrix.tag_suffix }}

      # --- Тесты (только в PR или native) ---
      - name: "Test: CUDA + ROS2 + package"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }}
          docker run --rm --platform ${{ matrix.docker_platform }} "${IMAGE}" bash -c "
            set -e
            source /opt/ros/humble/setup.bash
            source \${ROS2_INSTALL}/setup.bash
            echo '--- CUDA ---'      && ldconfig -p | grep libcudart
            echo '--- nvcc ---'      && nvcc --version | head -1
            echo '--- ros2 pkg ---'  && ros2 pkg list | grep -i '${{ matrix.package }}'
            echo '=== PACKAGE CHECKS PASSED ==='
          "