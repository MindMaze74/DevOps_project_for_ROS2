# ============================================================================
# Сборка ROS2-пакетов поверх базовых образов
# ============================================================================
name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/package/**'
      - 'config/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package (empty = all)'
        default: ''
      platform:
        description: 'Platform (empty = all)'
        default: ''
      build_type:
        description: 'Build type'
        type: choice
        default: 'cross'
        options: [ cross, native, both ]

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4

      - name: Generate matrix
        id: gen
        run: |
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" \
              '[.[] | select(.name == $p)]')
          fi

          COMBOS='[
            {"platform":"amd64","tag_suffix":"amd64","cuda_arch":"75",
             "docker_platform":"linux/amd64","build_type":"cross",
             "runner":"ubuntu-22.04"},
            {"platform":"arm64-agx","tag_suffix":"arm64-agx-cross","cuda_arch":"87",
             "docker_platform":"linux/arm64","build_type":"cross",
             "runner":"ubuntu-22.04"},
            {"platform":"arm64-agx","tag_suffix":"arm64-agx-native","cuda_arch":"87",
             "docker_platform":"linux/arm64","build_type":"native",
             "runner":"[self-hosted, linux, arm64, jetson-agx]"},
            {"platform":"arm64-nano","tag_suffix":"arm64-nano-cross","cuda_arch":"72",
             "docker_platform":"linux/arm64","build_type":"cross",
             "runner":"ubuntu-22.04"},
            {"platform":"arm64-nano","tag_suffix":"arm64-nano-native","cuda_arch":"72",
             "docker_platform":"linux/arm64","build_type":"native",
             "runner":"[self-hosted, linux, arm64, jetson-nano]"}
          ]'

          SELECTED_PLAT="${{ github.event.inputs.platform }}"
          if [ -n "$SELECTED_PLAT" ]; then
            COMBOS=$(echo "$COMBOS" | jq --arg p "$SELECTED_PLAT" \
              '[.[] | select(.platform == $p)]')
          fi

          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="cross"

          if [ "$BUILD_TYPE" = "both" ]; then
            FILTERED="$COMBOS"
          else
            FILTERED=$(echo "$COMBOS" | jq -c --arg bt "$BUILD_TYPE" \
              '[.[] | select(.build_type == $bt)]')
          fi

          MATRIX=$(jq -nc --argjson pkgs "$PACKAGES" --argjson combos "$FILTERED" \
            '{include: [
              $combos[] as $c | $pkgs[] as $pkg | {
                platform: $c.platform,
                tag_suffix: $c.tag_suffix,
                cuda_arch: $c.cuda_arch,
                docker_platform: $c.docker_platform,
                build_type: $c.build_type,
                runner: $c.runner,
                package: $pkg.name,
                git: $pkg.git,
                branch: $pkg.branch,
                cmake_args: $pkg.cmake_args
              }
            ]}')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX" | jq .

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository slug
        run: |
          REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_SLUG=${REPO_SLUG}" >> $GITHUB_ENV

      - name: Set up QEMU (cross only)
        if: matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/package/Dockerfile.template
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.tag_suffix }}
            PACKAGE_GIT=${{ matrix.git }}
            PACKAGE_BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
          platforms: ${{ matrix.docker_platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }}-latest
          cache-from: type=gha,scope=pkg-${{ matrix.package }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=pkg-${{ matrix.package }}-${{ matrix.tag_suffix }}

      - name: "Test: CUDA"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }} \
            bash -c "ldconfig -p | grep libcudart || exit 1"

      - name: "Test: ROS2"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.tag_suffix }} \
            bash -c "
              source /opt/ros/humble/setup.bash
              source /ros2_ws/install/setup.bash
              ros2 pkg list | grep -i '${{ matrix.package }}'
            "