name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/package/**'
      - 'config/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package (empty = all)'
        default: ''
      platform:
        description: 'Platform (empty = all)'
        default: ''
      build_type:
        description: 'cross | native | both'
        default: 'cross'
        type: choice
        options: [ cross, native, both ]

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4

      - name: Generate matrix
        id: gen
        run: |
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          # Платформы с runner-ами по ТЗ
          PLATFORMS='[
            {"name":"amd64","cuda_arch":"75","platform":"linux/amd64",
             "cross_runner":"ubuntu-22.04",
             "native_runner":"ubuntu-22.04",
             "supports_native":false},
            {"name":"arm64-agx","cuda_arch":"87","platform":"linux/arm64",
             "cross_runner":"ubuntu-22.04",
             "native_runner":"[self-hosted, linux, arm64, jetson-agx]",
             "supports_native":true},
            {"name":"arm64-nano","cuda_arch":"72","platform":"linux/arm64",
             "cross_runner":"ubuntu-22.04",
             "native_runner":"[self-hosted, linux, arm64, jetson-nano]",
             "supports_native":true}
          ]'

          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="cross"

          MATRIX=$(jq -nc \
            --argjson pkgs "$PACKAGES" \
            --argjson plats "$PLATFORMS" \
            --arg bt "$BUILD_TYPE" \
            '{include: [
              $plats[] as $p | $pkgs[] as $pkg |
              (if $bt == "both" then ["cross","native"] else [$bt] end)[] as $type |
              select($type == "cross" or ($type == "native" and $p.supports_native)) |
              {
                platform: $p.name,
                docker_platform: $p.platform,
                cuda_arch: $p.cuda_arch,
                runner: (if $type == "native" then $p.native_runner else $p.cross_runner end),
                build_type: $type,
                package: $pkg.name,
                git: $pkg.git,
                branch: $pkg.branch,
                cmake_args: $pkg.cmake_args
              }
            ]}')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX" | jq .

  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repository slug
        run: |
          REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "REPO_SLUG=${REPO_SLUG}" >> $GITHUB_ENV

      - name: Set up QEMU (cross only)
        if: matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/package/Dockerfile.template
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-humble-cuda-base:${{ matrix.platform }}
            PACKAGE_GIT=${{ matrix.git }}
            PACKAGE_BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
          platforms: ${{ matrix.docker_platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }}
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }}-latest
          cache-from: type=gha,scope=pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}
          cache-to: type=gha,mode=max,scope=pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}

      - name: "Test: CUDA"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }} \
            bash -c "ldconfig -p | grep libcudart || exit 1"

      - name: "Test: ROS2 package"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO_SLUG }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }} \
            bash -c "
              source /opt/ros/humble/setup.bash
              source /ros2_ws/install/setup.bash
              ros2 pkg list | grep -i '${{ matrix.package }}'
            "