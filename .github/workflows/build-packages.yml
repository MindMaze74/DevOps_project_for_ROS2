# ============================================================================
# Сборка ROS2-пакетов с CUDA
# ============================================================================
# Матрица: пакет × платформа × тип сборки (cross/native)
# Триггеры: push в main, тег, PR, ручной запуск
# ============================================================================
name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'docker/package/**'
      - 'config/**'
      - '.github/workflows/build-packages.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (empty = all)'
        required: false
        default: ''
      platform:
        description: 'Platform: amd64 | arm64-agx | arm64-nano (empty = all)'
        required: false
        default: ''
      build_type:
        description: 'Build type: cross | native | both'
        required: false
        default: 'cross'
        type: choice
        options: [ cross, native, both ]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}/ros2-humble-cuda-base

jobs:
  # ==========================================================================
  # JOB 1: Генерация динамической матрицы из packages.yaml
  # ==========================================================================
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: mikefarah/yq@v4

      - name: Generate build matrix
        id: generate
        run: |
          PACKAGES=$(yq -o=json -I=0 '.packages' config/packages.yaml)

          SELECTED_PKG="${{ github.event.inputs.package }}"
          if [ -n "$SELECTED_PKG" ]; then
            PACKAGES=$(echo "$PACKAGES" | jq --arg p "$SELECTED_PKG" \
              '[.[] | select(.name == $p)]')
          fi

          PLATFORMS='[
            {"name":"amd64","cuda_arch":"75","docker_platform":"linux/amd64",
             "runner":"ubuntu-22.04","supports_native":false},
            {"name":"arm64-agx","cuda_arch":"87","docker_platform":"linux/arm64",
             "runner":"[self-hosted, linux, arm64, jetson-agx]","supports_native":true},
            {"name":"arm64-nano","cuda_arch":"72","docker_platform":"linux/arm64",
             "runner":"[self-hosted, linux, arm64, jetson-nano]","supports_native":true}
          ]'

          SELECTED_PLAT="${{ github.event.inputs.platform }}"
          if [ -n "$SELECTED_PLAT" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg p "$SELECTED_PLAT" \
              '[.[] | select(.name == $p)]')
          fi

          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$BUILD_TYPE" ] && BUILD_TYPE="cross"

          # -c = compact JSON (одна строка) — ОБЯЗАТЕЛЬНО для GITHUB_OUTPUT
          MATRIX=$(jq -nc \
            --argjson pkgs "$PACKAGES" \
            --argjson plats "$PLATFORMS" \
            --arg bt "$BUILD_TYPE" \
            '{include: [
              $plats[] as $p | $pkgs[] as $pkg |
              (if $bt == "both" then ["cross","native"] else [$bt] end)[] as $type |
              select($type == "cross" or ($type == "native" and $p.supports_native)) |
              {
                platform: $p.name,
                docker_platform: $p.docker_platform,
                cuda_arch: $p.cuda_arch,
                runner: (if $type == "native" then $p.runner else "ubuntu-22.04" end),
                build_type: $type,
                package: $pkg.name,
                git: $pkg.git,
                branch: $pkg.branch,
                cmake_args: $pkg.cmake_args
              }
            ]}')

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "=== Generated matrix (compact) ==="
          echo "$MATRIX"
          echo "=== Pretty printed for readability ==="
          echo "$MATRIX" | jq .

  # ==========================================================================
  # JOB 2: Сборка (динамический runner: ubuntu-22.04 или self-hosted Jetson)
  # ==========================================================================
  build:
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross only)
        if: matrix.build_type == 'cross'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.package }} (${{ matrix.platform }}/${{ matrix.build_type }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/package/Dockerfile.template
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}:${{ matrix.platform }}
            PACKAGE_GIT=${{ matrix.git }}
            PACKAGE_BRANCH=${{ matrix.branch }}
            PACKAGE_NAME=${{ matrix.package }}
            CMAKE_ARGS=${{ matrix.cmake_args }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
          platforms: ${{ matrix.docker_platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }}
            ${{ env.REGISTRY }}/${{ github.repository }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }}-latest
          cache-from: type=gha,scope=pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}
          cache-to: type=gha,mode=max,scope=pkg-${{ matrix.package }}-${{ matrix.platform }}-${{ matrix.build_type }}

      # --- Тест 1: CUDA ---
      - name: "Test: CUDA availability"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ github.repository }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }} \
            bash -c "ldconfig -p | grep libcudart || exit 1"

      # --- Тест 2: ROS2 пакет ---
      - name: "Test: ROS2 package"
        if: github.event_name == 'pull_request' || matrix.build_type == 'native'
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ github.repository }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }} \
            bash -c "
              source /opt/ros/humble/setup.bash
              source /ros2_ws/install/setup.bash
              ros2 pkg list | grep -i '${{ matrix.package }}' || exit 1
            "

      # --- Trivy: сканирование уязвимостей (только cross) ---
      - name: Run Trivy scanner
        if: github.event_name == 'pull_request' && matrix.build_type == 'cross'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository }}/ros2-package-${{ matrix.package }}:${{ matrix.platform }}-${{ matrix.build_type }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        if: github.event_name == 'pull_request' && matrix.build_type == 'cross'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'