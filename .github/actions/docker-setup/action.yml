# ============================================================================
# Composite action: настройка Docker-окружения
# ============================================================================
# Устраняет дублирование шагов между build-base.yml и build-packages.yml.
#
# ВАЖНО: composite actions НЕ имеют доступа к secrets напрямую.
# Секреты (GITHUB_TOKEN, NGC_API_KEY) передаются явно через inputs
# из вызывающего workflow.
# ============================================================================
name: 'Docker Setup'
description: 'Lowercase slug, QEMU, Buildx, GHCR/NGC login'

inputs:
  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'
  setup_qemu:
    description: 'Install QEMU for cross-build (true/false)'
    required: false
    default: 'true'
  ngc_login:
    description: 'Login to NVIDIA NGC (true/false)'
    required: false
    default: 'false'
  ghcr_token:
    description: 'GHCR token (pass ${{ secrets.GITHUB_TOKEN }})'
    required: true
  ngc_api_key:
    description: 'NVIDIA NGC API key (pass ${{ secrets.NGC_API_KEY }})'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set lowercase repository slug
      shell: bash
      run: |
        REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
        echo "REPO_SLUG=${REPO_SLUG}" >> $GITHUB_ENV
        echo "Repo slug: ${REPO_SLUG}"

    - name: Set up QEMU
      if: inputs.setup_qemu == 'true'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr_token }}

    - name: Log in to NVIDIA NGC
      if: inputs.ngc_login == 'true'
      uses: docker/login-action@v3
      with:
        registry: nvcr.io
        username: $oauthtoken
        password: ${{ inputs.ngc_api_key }}